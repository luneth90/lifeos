name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to release'
        required: true
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release ref
        id: release_ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            REF="refs/tags/${TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
            REF="${GITHUB_REF}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_ref.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: 审计依赖漏洞
        run: npm audit --audit-level=low

      - name: Validate release tag
        run: npm run --silent release:check-version -- ${{ steps.release_ref.outputs.tag }}

      - name: Verify release build
        run: npm run release:verify

      - name: Pack npm artifact
        id: pack
        run: |
          TARBALL="$(npm run --silent release:pack)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        run: |
          node scripts/release/extract-changelog.mjs "${{ steps.release_ref.outputs.tag }}" > /tmp/release-notes.md

      - name: Publish to npm
        run: npm publish "${{ steps.pack.outputs.tarball }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(cat /tmp/release-notes.md)"
          gh release create "${{ steps.release_ref.outputs.tag }}" "${{ steps.pack.outputs.tarball }}" \
            --verify-tag \
            --generate-notes \
            --notes "$NOTES" \
            --title "${{ steps.release_ref.outputs.tag }}"
