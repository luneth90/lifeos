name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.14.1', '25']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm ci
      - name: 审计依赖漏洞
        run: npm audit --audit-level=low

  coverage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm ci
      - name: 统计测试覆盖率
        run: npx vitest run --coverage
      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage-final.json
          fail_ci_if_error: true
