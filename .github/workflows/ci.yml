name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Windows 上 Python 子进程默认使用控制台代码页（cp1252），中文输出会抛
# UnicodeEncodeError；统一强制 UTF-8（脚本内也已加 stdout reconfigure）
env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows 仅跑 Node LTS：better-sqlite3 对 node 25 无 Windows 预编译二进制，
          # node-gyp 源码构建在 windows runner 上会挂起（node 25 覆盖由 ubuntu 承担）
          - os: windows-latest
            node-version: '24.14.1'
          - os: ubuntu-latest
            node-version: '24.14.1'
          - os: ubuntu-latest
            node-version: '25'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Windows 上 vitest fork worker 在跑完大量文件后偶发异常退出（疑似
      # Windows 句柄/资源累积，vitest/Node 组合问题，测试本身全过）；
      # 拆成三批独立进程运行，每批新 worker 重置资源，失败重试一次兜底
      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx vitest run tests/cli tests/services tests/db tests/utils || \
              npx vitest run tests/cli tests/services tests/db tests/utils
            npx vitest run tests/assets tests/security tests/scripts tests/skill-contracts tests/evals tests/active-docs || \
              npx vitest run tests/assets tests/security tests/scripts tests/skill-contracts tests/evals tests/active-docs
            npx vitest run tests/config.test.ts tests/core.test.ts tests/cutover-lock.test.ts \
              tests/documentation-consistency.test.ts tests/runtime-contract.test.ts \
              tests/server-entry.test.ts tests/server.test.ts tests/e2e || \
              npx vitest run tests/config.test.ts tests/core.test.ts tests/cutover-lock.test.ts \
                tests/documentation-consistency.test.ts tests/runtime-contract.test.ts \
                tests/server-entry.test.ts tests/server.test.ts tests/e2e
          else
            npm test
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm ci
      - name: 审计依赖漏洞
        run: npm audit --audit-level=low

  coverage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm ci
      - name: 统计测试覆盖率
        run: npx vitest run --coverage
      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage-final.json
          fail_ci_if_error: true
