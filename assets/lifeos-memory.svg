<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LifeOS 记忆系统 V2 架构</title>
  <desc id="desc">展示 Agent、ScopeCatalog、八个 MCP 工具、双输出、当前投影与历史、维护状态、CLI purge 备份边界和 Schema V6 No-Go。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#be123c"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker>
    <style>
      .edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
      .edge-dashed{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow-purple)}
      .edge-danger{fill:none;stroke:#be123c;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow-red)}
      .node{filter:url(#shadow);stroke-width:2}
      .label{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a;text-anchor:middle}
      .sub{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155;text-anchor:middle}
      .tiny{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569;text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="34" class="label" font-size="25">LifeOS 记忆系统 V2 · Schema V5</text>

  <path class="edge" d="M210 125 H250"/><path class="edge" d="M470 125 H510"/>
  <path class="edge" d="M780 125 H820"/><path class="edge" d="M1070 125 H1110"/>
  <path class="edge" d="M1335 235 V280"/><path class="edge" d="M1415 235 V420"/>
  <path class="edge" d="M1315 380 V420"/><path class="edge" d="M1325 420 V380"/>
  <path class="edge" d="M1160 235 C1080 280 1010 335 910 400"/>
  <path class="edge" d="M750 460 V520"/><path class="edge" d="M780 520 V460"/>
  <path class="edge" d="M1110 200 C920 260 700 310 490 410"/>
  <path class="edge-danger" d="M460 665 C485 690 495 720 520 750"/>
  <path class="edge-danger" d="M700 690 V460"/>
  <path class="edge-dashed" d="M1100 700 C1020 650 960 550 880 460"/>

  <g data-semantic="Agent"><rect class="node" x="40" y="80" width="170" height="90" rx="18" fill="#ffffff" stroke="#64748b"/><text x="125" y="134" class="label">Agent 会话</text></g>
  <g data-semantic="Bootstrap"><rect class="node" x="250" y="60" width="220" height="130" rx="18" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="112" class="label">memory_bootstrap</text><text x="360" y="144" class="sub">仅 global Layer 0</text></g>
  <g data-semantic="ScopeCatalog"><rect class="node" x="510" y="50" width="270" height="150" rx="18" fill="#dcfce7" stroke="#16a34a"/><text x="645" y="94" class="label">ScopeCatalog</text><text x="645" y="126" class="sub">安装技能 · 配置工具/仓库</text><text x="645" y="154" class="sub">索引项目/文件 · 零记忆合法</text><text x="645" y="180" class="tiny">未知写入拒绝</text></g>
  <g data-semantic="ContextQuery"><rect class="node" x="820" y="60" width="250" height="130" rx="18" fill="#fef3c7" stroke="#d97706"/><text x="945" y="106" class="label">context / query</text><text x="945" y="138" class="sub">显式局部画像</text><text x="945" y="166" class="sub">排名与可追溯证据</text></g>
  <g data-semantic="EightTools"><rect class="node" x="1110" y="55" width="450" height="180" rx="20" fill="#ede9fe" stroke="#7c3aed"/><text x="1335" y="91" class="label">8 个 MCP 工具</text><text x="1335" y="125" class="sub">bootstrap · query · context · log</text><text x="1335" y="155" class="sub">rules · history · forget · notify</text><text x="1335" y="191" class="tiny">全部 strict outputSchema</text><text x="1335" y="216" class="tiny">第 8 个 memory_history 只读</text></g>

  <g data-semantic="StructuredOutput"><rect class="node" x="1120" y="280" width="380" height="100" rx="16" fill="#e0f2fe" stroke="#0284c7"/><text x="1310" y="322" class="label">structuredContent</text><text x="1310" y="352" class="sub">机器可解析结果</text></g>
  <g data-semantic="TextOutput"><rect class="node" x="1120" y="420" width="380" height="100" rx="16" fill="#e0f2fe" stroke="#0284c7"/><text x="1310" y="462" class="label">content[0].text</text><text x="1310" y="492" class="sub">等值 JSON 文本兼容层</text></g>

  <g data-semantic="MemoryItems"><rect class="node" x="590" y="340" width="320" height="120" rx="18" fill="#ffffff" stroke="#0f766e"/><text x="750" y="390" class="label">memory_items</text><text x="750" y="425" class="sub">当前投影</text></g>
  <g data-semantic="MemoryEvents"><rect class="node" x="590" y="520" width="320" height="120" rx="18" fill="#ffffff" stroke="#0f766e"/><text x="750" y="570" class="label">memory_item_events</text><text x="750" y="605" class="sub">正常 append-only 历史</text></g>
  <g data-semantic="MaintenanceState"><rect class="node" x="80" y="340" width="410" height="150" rx="18" fill="#ecfccb" stroke="#65a30d"/><text x="285" y="382" class="label">每 Vault single-flight 维护</text><text x="285" y="416" class="sub">pending → running</text><text x="285" y="447" class="sub">succeeded / failed</text><text x="285" y="474" class="tiny">例行有限强度 · doctor 显式强压缩</text></g>

  <g data-semantic="CliPurge"><rect class="node" x="80" y="600" width="380" height="130" rx="18" fill="#fff1f2" stroke="#be123c"/><text x="270" y="643" class="label">CLI 单条 purge</text><text x="270" y="677" class="sub">已归档 · 双 item id · 非空原因</text><text x="270" y="707" class="tiny">MCP 不提供 purge</text></g>
  <g data-semantic="BackupBoundary"><rect class="node" x="520" y="690" width="360" height="120" rx="18" fill="#fff1f2" stroke="#be123c"/><text x="700" y="734" class="label">备份边界</text><text x="700" y="768" class="sub">在 purge-backups 中创建并验证</text><text x="700" y="795" class="tiny">独立 SQLite 备份文件</text></g>
  <g data-semantic="NoSchemaV6"><rect class="node" x="1030" y="650" width="430" height="140" rx="18" fill="#faf5ff" stroke="#7c3aed"/><text x="1245" y="697" class="label">Schema V6 量化 No-Go</text><text x="1245" y="734" class="sub">长文 Recall@5 = 1.0</text><text x="1245" y="766" class="sub">不创建分段表或分段检索</text></g>
</svg>
